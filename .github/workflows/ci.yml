name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@v6

  build:
    name: Build (${{ matrix.os }})
    needs: wrapper-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle_command: ./gradlew
          - os: windows-latest
            gradle_command: ./gradlew.bat
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
      - name: Build and test
        run: ${{ matrix.gradle_command }} clean build --no-daemon
